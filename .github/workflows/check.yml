name: Checkout checks
on:
  push:
    branches: ['blackout/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if test -f package-lock.json; then npm ci; else npm install; fi
      - run: npm test
      - run: node scripts/deploy.mjs --prepare
      - name: Probe public Arc testnet independently of offline tests
        continue-on-error: true
        run: npm run spike
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-evidence
          path: |
            artifacts/
            package-lock.json
