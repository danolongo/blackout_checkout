name: Checkout checks
on:
  push:
    branches: ['blackout/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if test -f package-lock.json; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Rehearse the fixed deployment and purchase twice
        if: matrix.browser == 'chromium'
        run: node scripts/demo-sale.mjs --rehearse
      - name: Finish or resume the Arc demo sale
        if: matrix.browser == 'chromium'
        run: node scripts/demo-sale.mjs
      - run: npm run test:browser
      - name: Probe public Arc testnet independently of offline tests
        continue-on-error: true
        run: npm run spike
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkout-evidence-${{ matrix.browser }}
          path: |
            artifacts/
            package-lock.json
